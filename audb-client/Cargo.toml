[package]
name = "audb-client"
version = "0.2.0"
edition = "2021"
license = "MIT"
description = "CLI client for Aurora Debug Bridge - development tool for Aurora OS"
repository = "https://github.com/KotDath/audb"
readme = "../README.md"
keywords = ["aurora", "adb", "cli", "mobile"]
categories = ["development-tools", "command-line-utilities"]

[[bin]]
name = "audb"
path = "src/main.rs"

[dependencies]
audb-core = { version = "0.2.0", path = "../audb-core" }
audb-protocol = { version = "0.2.0", path = "../audb-protocol" }

tokio = { version = "1.48", features = ["full"] }
serde_json = "1.0"
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
directories = "5.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tempfile = { workspace = true }

[dev-dependencies]
